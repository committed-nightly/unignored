[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unignored"
version = "0.1.0"
description = "Find the .gitignore rules that do nothing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["git", "gitignore", "linter", "static-analysis", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
unignored = "unignored.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/unignored"

[tool.hatch.build.targets.wheel]
packages = ["src/unignored"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
